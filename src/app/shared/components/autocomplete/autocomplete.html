<mat-form-field appearance="outline" class="w-full">
    @if(label){
    <mat-label>
        {{ label }}
    </mat-label>
    }
    @if (icon) {

    <mat-icon matPrefix>
        {{ icon }}
    </mat-icon>

    }
    <input matInput type="text" [placeholder]="placeholder" [formControl]="control" [matAutocomplete]="auto">
    <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption
        (optionSelected)="selectStation($event.option.value)">
        @let options = (filteredOptions | async);
        @for (option of options; track option.name) {
        <mat-option [value]="option.name">
            <mat-icon class="!h-[14px] !w-[14px] !text-[14px] !text-gray-400">
                train
            </mat-icon>
            {{ option.name || option }}
        </mat-option>
        }
    </mat-autocomplete>
</mat-form-field>
